<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WELA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231428a0'/%3E%3Cpath d='M6 20h5l3-9 4 13 3-8h5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brandHome" title="New analysis">
    <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M6 20h5l3-9 4 13 3-8h5"/></svg>
    <div><div class="brand-name">WELA</div><div class="brand-sub">Windows Event Log Analyzer</div></div>
  </div>
  <div class="top-actions">
    <label class="tz">Time
      <select id="tzSelect">
        <option value="0">UTC</option>
        <option value="330">IST (UTC+05:30)</option>
        <option value="local">This PC</option>
        <option value="-300">US Central (UTC-05:00)</option>
        <option value="-420">US Pacific (UTC-07:00)</option>
        <option value="60">CET (UTC+01:00)</option>
        <option value="480">China (UTC+08:00)</option>
        <option value="540">Korea (UTC+09:00)</option>
      </select>
    </label>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="btn primary block" id="newBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New analysis
    </button>
    <div class="side-title">Recent cases</div>
    <div id="caseList" class="case-list"><div class="muted small pad">No cases yet</div></div>
  </aside>

  <main id="main"></main>
</div>

<div id="drawerBack" class="drawer-back"></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="tooltip" class="tooltip"></div>
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
